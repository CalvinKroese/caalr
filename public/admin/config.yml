backend:
  name: github
  repo: CalvinKroese/caalr
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Lets the editor run fully on a local machine (via `npx decap-server`) for
# testing. Ignored in production — Decap only uses it when served from localhost.
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "artists"
    label: "Artists"
    folder: "src/content/artists"
    create: true
    slug: "{{name | slugify}}"
    identifier_field: "name"
    format: "frontmatter"
    sortable_fields: ["name"]
    summary: "{{name}} — {{mediums}}"
    editor:
      preview: true
    fields:
      - { label: "Name", name: "name", widget: "string", hint: "Full name of the artist" }
      - label: "Art Medium(s)"
        name: "mediums"
        widget: "list"
        hint: "Add each medium separately (e.g. Pottery, Watercolor)"
        field: { label: "Medium", name: "medium", widget: "string" }
      - { label: "Short Bio (shown on card)", name: "shortBio", widget: "text", hint: "One or two sentences shown on the Artists page" }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Instagram", name: "instagram", widget: "string", required: false }
      - { label: "Facebook", name: "facebook", widget: "string", required: false }
      - { label: "Profile Photo", name: "featuredImage", widget: "image" }
      - { label: "Photo is Temporary?", name: "photoIsTemp", widget: "boolean", default: false, hint: "Check if this is a placeholder photo — shows 'Photo Coming Soon' on the site" }
      # Artwork is managed entirely in the Gallery — add a photo there and set its
      # "Artist" field to this person, and it appears on their page automatically.
      - { label: "Board Role", name: "boardRole", widget: "string", required: false, hint: "Only fill in if this person is on the board (e.g. President, Vice President, At Large). Leave blank otherwise — that's what makes someone a board member." }
      - { label: "Full Biography", name: "body", widget: "markdown", required: false, hint: "The longer bio that appears on the artist's own page" }

  - name: "events"
    label: "Shows & Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    sortable_fields: ["title", "startDate"]
    summary: "{{title}} — {{startDate}}"
    editor:
      preview: true
    fields:
      - { label: "Show / Event Name", name: "title", widget: "string" }
      - { label: "Start Date", name: "startDate", widget: "datetime" }
      - { label: "End Date (if multi-day)", name: "endDate", widget: "datetime", required: false }
      - { label: "Venue Name", name: "venueName", widget: "string" }
      - { label: "Street Address", name: "venueAddress", widget: "string", required: false, hint: "Used to create a Google Maps link for visitors" }
      - { label: "Flyer or Event Photo", name: "featuredImage", widget: "image", required: false }
      - label: "Event Photos"
        name: "galleryImages"
        widget: "list"
        required: false
        hint: "Add photos from the event (can be added after the event)"
        field: { label: "Image", name: "image", widget: "image" }
      - { label: "Feature on Homepage?", name: "featured", widget: "boolean", default: false }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Gallery"
    folder: "src/content/gallery"
    create: true
    format: "json"
    sortable_fields: ["title", "year"]
    summary: "{{title}} ({{year}})"
    editor:
      preview: true
    fields:
      - { label: "Image Title", name: "title", widget: "string", hint: "A short title for this artwork" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Description for Screen Readers", name: "alt", widget: "string", hint: "Describe what is shown in the photo (for visually impaired visitors)" }
      - { label: "Artist", name: "artistSlug", widget: "string", required: false, hint: "Enter the artist's URL name (e.g. wilma-kroese) — image will appear on their page" }
      - { label: "Year", name: "year", widget: "number", required: false }
      # No homepage toggle: the homepage auto-rotates a monthly selection of artwork.

  - name: "news"
    label: "News & Highlights"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    sortable_fields: ["title", "date"]
    summary: "{{title}} — {{date}}"
    editor:
      preview: true
    fields:
      - { label: "Headline", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Publication or Source", name: "sourceName", widget: "string", required: false, hint: "e.g. Lakewood Ranch Herald" }
      - { label: "Link to Article", name: "sourceUrl", widget: "string", required: false }
      - { label: "Photo", name: "featuredImage", widget: "image", required: false }
      - { label: "Featured?", name: "featured", widget: "boolean", default: false }
      - { label: "Story", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    editor:
      preview: true
    files:
      - label: "Home Page"
        name: "home"
        file: "src/content/pages/home.md"
        fields:
          - { label: "Welcome line (small text above the title)", name: "heroEyebrow", widget: "string" }
          - { label: "Main Title", name: "heroTitle", widget: "string" }
          - { label: "Intro sentence (under the title)", name: "heroText", widget: "text" }
          # The top slideshow auto-rotates a random set of Gallery artwork — no field to manage.
          - { label: "Our Story — Heading", name: "storyTitle", widget: "string" }
          - { label: "Our Story — Text", name: "introText", widget: "markdown" }
          - label: "Our Story — Photos"
            name: "storyImages"
            widget: "list"
            hint: "Photos that rotate beside the Our Story text (e.g. community / art-show photos)."
            field: { label: "Photo", name: "image", widget: "image" }
      - label: "About Page"
        name: "about"
        file: "src/content/pages/about.md"
        fields:
          - { label: "Hero Title (top of page)", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "string" }
          - { label: "Hero Script Label (small text above the title)", name: "heroScript", widget: "string" }
          - label: "Banner Photos (row under the title)"
            name: "bannerPhotos"
            widget: "list"
            hint: "Photos shown in the strip beneath the page title."
            field: { label: "Photo", name: "image", widget: "image" }
          - { label: "Mission Title", name: "missionTitle", widget: "string" }
          - { label: "Mission Text", name: "missionBody", widget: "markdown" }
          - { label: "Mission Photo", name: "missionPhoto", widget: "image", required: false }
          - { label: "Membership Title", name: "membershipTitle", widget: "string" }
          - { label: "Membership Info", name: "membershipBody", widget: "markdown" }
          - { label: "Sidebar Photo", name: "sidebarPhoto", widget: "image", required: false }
          - label: "Resource Links"
            name: "resources"
            widget: "list"
            hint: "Links to local art centers and resources"
            fields:
              - { label: "Name", name: "label", widget: "string" }
              - { label: "Website URL", name: "url", widget: "string" }
      - label: "Artists Page (header)"
        name: "artists_page"
        file: "src/content/pages/artists.md"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "string" }
          - { label: "Hero Script Label", name: "heroScript", widget: "string" }
      - label: "Events Page (header)"
        name: "events_page"
        file: "src/content/pages/events.md"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "string" }
          - { label: "Hero Script Label", name: "heroScript", widget: "string" }
      - label: "News Page (header)"
        name: "news_page"
        file: "src/content/pages/news.md"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "string" }
          - { label: "Hero Script Label", name: "heroScript", widget: "string" }
      - label: "Gallery Page (header)"
        name: "gallery_page"
        file: "src/content/pages/gallery.md"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "string" }
          - { label: "Hero Script Label", name: "heroScript", widget: "string" }

  - name: "settings"
    label: "Site Settings"
    editor:
      preview: false
    files:
      - label: "General"
        name: "site"
        file: "src/content/settings/site.json"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", hint: "Shown in the header and footer." }
          - { label: "Footer Tagline", name: "tagline", widget: "string", hint: "Short phrase under the footer logo, e.g. create. connect. inspire." }
          - { label: "Contact Email", name: "contactEmail", widget: "string" }
          - { label: "Footer Text", name: "footerText", widget: "text" }
      # Board of Directors is derived from artist profiles — set "Board Member?"
      # and "Board Role" on each artist. No separate board list to keep in sync.
      - label: "Meeting Schedule"
        name: "meetings"
        file: "src/content/settings/meetings.json"
        fields:
          - { label: "Schedule Summary", name: "scheduleSummary", widget: "text", hint: "e.g. Second Monday of each month, September through May" }
          - { label: "Location Name", name: "locationName", widget: "string" }
          - { label: "Location Address", name: "locationAddress", widget: "string" }
          - { label: "Google Maps Link", name: "mapUrl", widget: "string", required: false }
          - { label: "Board Meeting Time", name: "boardTime", widget: "string" }
          - { label: "Networking Time", name: "networkingTime", widget: "string" }
          - { label: "General Meeting Time", name: "generalTime", widget: "string" }
          - label: "Meeting Dates"
            name: "dates"
            widget: "list"
            fields:
              - { label: "Date", name: "date", widget: "datetime" }
              - { label: "Type", name: "type", widget: "string", hint: "e.g. Board and Membership, Spring Show Setup" }
          - { label: "Notes", name: "notes", widget: "text", required: false, hint: "e.g. No meetings in July and August" }
      - label: "Social Media"
        name: "social"
        file: "src/content/settings/social.json"
        fields:
          - { label: "Facebook URL", name: "facebookUrl", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string", required: false }
